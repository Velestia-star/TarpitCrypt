[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarpitcrypt"
version = "0.4.0"
description = "把程序包加密成双击即可运行的单文件 exe，明文不长期留盘"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.urls]
Repository = "https://github.com/Velestia-star/TarpitCrypt"

[project.scripts]
tarpitcrypt = "armor.runtime_pack:cli_main"
tarpitcrypt-armor = "armor.armor_gui:main"

[tool.setuptools.packages.find]
include = ["armor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
