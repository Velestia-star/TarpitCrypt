[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarpitcrypt"
version = "0.3.12"
description = "反 AI 逆向整活：用信息污染让逆向 agent 反复做无用功"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://Velestia-star.github.io/TarpitCrypt/"
Repository = "https://github.com/Velestia-star/TarpitCrypt"
Changelog = "https://github.com/Velestia-star/TarpitCrypt/blob/main/CHANGELOG.md"
Issues = "https://github.com/Velestia-star/TarpitCrypt/issues"

[project.scripts]
tarpitcrypt = "tarpitcrypt:main"
tarpitcrypt-web = "tarpitcrypt_server:main"

[tool.setuptools]
py-modules = ["tarpitcrypt", "tarpitcrypt_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["browser: 需要本机 Edge/Chrome 的端到端兼容性测试"]
