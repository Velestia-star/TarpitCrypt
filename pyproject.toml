[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarpitcrypt"
version = "0.9.0"
description = "正常双击即用，反 AI 逆向时消耗其时间与算力的加固工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.urls]
Repository = "https://github.com/Velestia-star/TarpitCrypt"

[project.scripts]
tarpitcrypt = "runtime_pack:cli_main"
tarpitcrypt-armor = "armor_gui:main"

[tool.setuptools]
py-modules = [
    "runtime_pack",
    "runtime_runner",
    "build_runner",
    "drop_target",
    "armor_gui",
    "trap_kit",
    "trap_guard",
    "selftest",
]
