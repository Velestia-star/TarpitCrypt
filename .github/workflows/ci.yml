name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # GitHub 的英文 Windows runner 控制台是 cp1252，而本仓库大量脚本用中文
    # 输出。Python 3.15 起默认 UTF-8 模式（PEP 686）所以本地不会复现，
    # 3.11~3.13 会直接 UnicodeEncodeError。显式打开 UTF-8 模式。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argon2-cffi>=23.1" "cryptography>=42.0" "pytest>=8.0"

      - name: 语法编译
        run: python -m compileall -q tarpitcrypt.py tarpitcrypt_server.py armor tests

      - name: v1 单元测试 + 固定样本格式兼容
        # 浏览器互解依赖本机 Edge/Chrome 与 headless WASM，单独跑、不阻断矩阵。
        run: python -m pytest tests -o addopts="" -m "not browser"

      - name: 浏览器 ↔ Python 双向互解（建议项）
        continue-on-error: true
        run: python -m pytest tests -o addopts="" -m browser

      - name: armor 端到端自测
        run: python armor/selftest.py

      - name: 还原保真度与可运行性矩阵
        # 矩阵也已并入 selftest，这里单独跑一遍便于快速定位失败。
        # 权限位、只读属性、执行位这些坑在 Linux/macOS 上才会真正咬人
        # （Windows 没有执行位），所以三平台都要跑。
        run: python -m armor.runtime_check

      - name: 模拟逆向冒烟（轮数对照 + 评估报告）
        run: |
          python armor/probe_agent.py
          python armor/agent_eval.py --runs 2

  lint:
    name: ruff 建议项（暂不阻断合并）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check --output-format=concise .
