name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "argon2-cffi>=23.1" "cryptography>=42.0" "pytest>=8.0"

      - name: 语法编译
        run: python -m compileall -q tarpitcrypt.py tarpitcrypt_server.py armor tests

      - name: v1 单元测试 + 固定样本格式兼容
        run: python -m pytest tests -o addopts=""

      - name: armor 端到端自测
        run: python armor/selftest.py

      - name: 模拟逆向冒烟（轮数对照 + 评估报告）
        run: |
          python armor/probe_agent.py
          python armor/agent_eval.py --runs 2

  lint:
    name: ruff 建议项（暂不阻断合并）
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check --output-format=concise .
